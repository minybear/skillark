[package]
name = "skillark"
version = "0.1.0"
description = "Local-first skill manager for AI coding agents"
authors = ["SkillArk contributors"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "skillark_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "migrate", "macros", "uuid", "chrono"] }
thiserror = "2"
uuid = { version = "1", features = ["serde", "v7", "v4"] }
chrono = { version = "0.4", features = ["serde"] }
zip = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_Globalization",
] }
junction = "1"

[dev-dependencies]
jsonschema = { version = "0.48", default-features = false }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
